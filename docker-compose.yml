services:
  fastapi:
    build: ./investigation-engine
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-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}
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - fastapi
volumes:
  n8n_data:
